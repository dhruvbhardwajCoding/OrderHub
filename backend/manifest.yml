applications:
  - name: orderhub-srv
    path: .
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    env:
      NODE_ENV: production
      CDS_ENV: production
    services:
      - orderhub-hdi
      - orderhub-xsuaa
    random-route: true
    health-check-type: process
